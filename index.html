<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Experiencia Visual Interactiva - Low Poly</title>
    <style>
        /* Estilos Generales y Reset */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {
            width: 100%;
            height: 100%;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0b0f19;
            color: #ffffff;
            overflow-x: hidden;
            scroll-behavior: smooth;
        }

        /* Canvas de Partículas Reactivas de Fondo */
        #reactive-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            background: radial-gradient(circle at center, #1b1b3a 0%, #050508 100%);
        }

        /* Secciones Parallax */
        .parallax-section {
            position: relative;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 0 20px;
            overflow: hidden;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        /* Capa 1: Visuales Reactivos / Bienvenida */
        .hero-content {
            z-index: 2;
            background: rgba(11, 15, 25, 0.6);
            padding: 40px 60px;
            border-radius: 20px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 0, 128, 0.3);
            box-shadow: 0 0 40px rgba(255, 0, 128, 0.2);
        }

        h1 {
            font-size: 3.5rem;
            margin-bottom: 15px;
            background: linear-gradient(45deg, #ff007f, #7928ca, #00dfd8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        p {
            font-size: 1.2rem;
            color: #a0aec0;
            max-width: 600px;
        }

        /* Capa 2: Animación Autónoma */
        .autonomous-container {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .floating-shape {
            position: absolute;
            width: 150px;
            height: 150px;
            background: linear-gradient(135deg, #ff007f, #00dfd8);
            clip-path: polygon(50% 0%, 100% 38%, 82% 100%, 18% 100%, 0% 38%);
            animation: floatAutonomous 8s ease-in-out infinite alternate;
            filter: drop-shadow(0 0 20px #ff007f);
        }

        .floating-shape:nth-child(2) {
            width: 200px;
            height: 200px;
            background: linear-gradient(135deg, #7928ca, #ffb800);
            clip-path: polygon(25% 0%, 100% 0%, 75% 100%, 0% 100%);
            animation: floatAutonomous 12s ease-in-out infinite alternate-reverse;
            filter: drop-shadow(0 0 30px #7928ca);
            opacity: 0.7;
        }

        @keyframes floatAutonomous {
            0% {
                transform: translateY(-50px) rotate(0deg) scale(1);
            }
            50% {
                transform: translateY(50px) rotate(180deg) scale(1.2);
            }
            100% {
                transform: translateY(-30px) rotate(360deg) scale(0.9);
            }
        }

        /* Capa 3: Paisaje Low Poly (Bosque con Cascada) */
        .lowpoly-scene {
            position: relative;
            width: 100%;
            height: 100vh;
            background: linear-gradient(to bottom, #101c2c, #1f3b4d);
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: flex-end;
        }

        .sun {
            position: absolute;
            top: 10%;
            left: 50%;
            transform: translateX(-50%);
            width: 120px;
            height: 120px;
            background: linear-gradient(to bottom, #ffea00, #ff5500);
            border-radius: 50%;
            box-shadow: 0 0 50px #ff5500;
        }

        /* Montañas Low Poly (Geometría con clip-path) */
        .mountain-bg {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 60vh;
            background: #192a3a;
            clip-path: polygon(0% 100%, 10% 40%, 25% 70%, 40% 30%, 60% 80%, 75% 20%, 90% 60%, 100% 100%);
            z-index: 1;
        }

        .mountain-fg {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 45vh;
            background: #111d28;
            clip-path: polygon(0% 100%, 15% 50%, 35% 85%, 55% 40%, 80% 90%, 100% 50%, 100% 100%);
            z-index: 2;
        }

        /* Cascada Low Poly */
        .waterfall {
            position: absolute;
            top: 35%;
            left: 50%;
            transform: translateX(-50%);
            width: 80px;
            height: 45vh;
            background: linear-gradient(180deg, rgba(255,255,255,0.8) 0%, rgba(0,223,216,0.6) 100%);
            clip-path: polygon(30% 0%, 70% 0%, 100% 100%, 0% 100%);
            z-index: 3;
            animation: flowWater 1.5s linear infinite;
        }

        @keyframes flowWater {
            0% {
                filter: brightness(1);
            }
            50% {
                filter: brightness(1.3);
            }
            100% {
                filter: brightness(1);
            }
        }

        /* Árboles Low Poly de ejemplo */
        .tree {
            position: absolute;
            bottom: 10px;
            width: 0;
            height: 0;
            border-left: 20px solid transparent;
            border-right: 20px solid transparent;
            border-bottom: 60px solid #0d2319;
            z-index: 4;
        }

        .tree.t1 { left: 20%; border-bottom-color: #1b4d3e; }
        .tree.t2 { left: 25%; border-bottom-color: #123524; transform: scale(1.2); }
        .tree.t3 { right: 22%; border-bottom-color: #1b4d3e; }
        .tree.t4 { right: 18%; border-bottom-color: #123524; transform: scale(0.9); }

        .scene-title {
            position: absolute;
            top: 40px;
            z-index: 10;
            text-shadow: 0 2px 10px rgba(0,0,0,0.8);
        }
    </style>
</head>
<body>

    <!-- Canvas para Partículas Reactivas al Mouse -->
    <canvas id="reactive-canvas"></canvas>

    <!-- SECCIÓN 1: Visuales Reactivos -->
    <section class="parallax-section">
        <div class="hero-content">
            <h1>Efecto Reactivo</h1>
            <p>Mueve el cursor por la pantalla para interactuar con los colores intensos y las partículas dinámicas en tiempo real.</p>
        </div>
    </section>

    <!-- SECCIÓN 2: Animación Autónoma -->
    <section class="parallax-section">
        <div class="autonomous-container">
            <div class="floating-shape"></div>
            <div class="floating-shape"></div>
            <div class="hero-content" style="background: rgba(11, 15, 25, 0.8);">
                <h1>Movimiento Autónomo</h1>
                <p>Estructuras geométricas flotantes con rotación y escala independientes que operan en segundo plano.</p>
            </div>
        </div>
    </section>

    <!-- SECCIÓN 3: Paisaje Low Poly (Bosque con Cascada) -->
    <section class="lowpoly-scene">
        <h1 class="scene-title">Naturaleza Low Poly</h1>
        <div class="sun"></div>
        <div class="mountain-bg"></div>
        <div class="mountain-fg"></div>
        <div class="waterfall"></div>
        <!-- Árboles en los laterales -->
        <div class="tree t1"></div>
        <div class="tree t2"></div>
        <div class="tree t3"></div>
        <div class="tree t4"></div>
    </section>

    <!-- Script de Interactividad y Partículas Reactivas -->
    <script>
        const canvas = document.getElementById('reactive-canvas');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        let mouse = {
            x: window.innerWidth / 2,
            y: window.innerHeight / 2,
            radius: 150
        };

        window.addEventListener('mousemove', (event) => {
            mouse.x = event.clientX;
            mouse.y = event.clientY;
        });

        // Generar partículas reactivas de colores fuertes
        class Particle {
            constructor() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.size = Math.random() * 4 + 1;
                this.baseX = this.x;
                this.baseY = this.y;
                this.density = (Math.random() * 25) + 5;
                this.color = `hsl(${Math.random() * 60 + 300}, 100%, 60%)`; // Tonos fucsia / violeta / neón
            }

            draw() {
                ctx.fillStyle = this.color;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.closePath();
                ctx.fill();
            }

            update() {
                // Interacción reactiva con el cursor
                let dx = mouse.x - this.x;
                let dy = mouse.y - this.y;
                let distance = Math.sqrt(dx * dx + dy * dy);
                let forceDirectionX = dx / distance;
                let forceDirectionY = dy / distance;
                
                let maxDistance = mouse.radius;
                let force = (maxDistance - distance) / maxDistance;

                if (distance < mouse.radius) {
                    this.x -= forceDirectionX * force * 5;
                    this.y -= forceDirectionY * force * 5;
                } else {
                    if (this.x !== this.baseX) {
                        let dx = this.x - this.baseX;
                        this.x -= dx / 15;
                    }
                    if (this.y !== this.baseY) {
                        let dy = this.y - this.baseY;
                        this.y -= dy / 15;
                    }
                }
            }
        }

        let particlesArray = [];
        function initParticles() {
            particlesArray = [];
            let numberOfParticles = (canvas.width * canvas.height) / 9000;
            for (let i = 0; i < numberOfParticles; i++) {
                particlesArray.push(new Particle());
            }
        }
        initParticles();

        function animateParticles() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            for (let i = 0; i < particlesArray.length; i++) {
                particlesArray[i].draw();
                particlesArray[i].update();
            }
            requestAnimationFrame(animateParticles);
        }
        animateParticles();
    </script>
</body>
</html>
